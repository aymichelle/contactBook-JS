<html>
    <head>
        <meta charset="UTF-8"> <!-- charctr encoding. ensures that the webpage can display text correctly, incl. speacial chartrs, emojis, non-english charctrs.-->
        <title></title>
    </head>
    <body onload="fetchContacts()">  <!-- onload handler that calls the fetchContacts function when the page loads.-->

        <div id="table"> Contacts loading...</div>
        <button id="refresh" type="button">Refresh</button>
        <button id="addContact" type="button">Add Contact</button>
        
        <script src="config.js"></script>
        <script> 

            document.getElementById("refresh").addEventListener("click", fetchContacts); //adds an event listener to the refresh button that calls the fetchContacts function when clicked.
            document.getElementById("addContact").addEventListener("click", addContact); 

            
            function fetchContacts() { 
                fetch(rootPath + "controller/get-contacts/") //fetch API call to rootPath + controller/get-contacts/
                .then(function(response) {
                    return response.json(); //takes the response object thats coming from the server and converts it to JSON array then retuns it to the next callback function. 
                })
                .then(function(data){ //call back function that takes the JSON data retured from the server and passes it to the displayOutput function. 
                    displayOutput(data);
                    //console.log(data); // logs data to the console for debugging purposes. 

                })
             }

             function displayOutput(data) { 
                output = "<table>";

                    for(a in data){
                        output += `
                        <tr onclick="editContact(${data[a].id})">
                            <td>img src="${rootPath}controller/uploads/${data[a].avatar}" width="40"/></td>
                            <td><h5>${data[a].firstname}</h5></td>
                            <td><h5>${data[a].lastname}</h5></td>
                        </tr>                        
                    `
                    }
                    output += "</table>";
                    document.getElementById("table").innerHTML = output; //sets the innerHTML
                }

                function addContact() {
                    window.open("add-contact.html", "_self"); //opens the add-contact.html page in the same tab/window.
                }

                function editContact(id) {
                    window.open("edit-contact.html?id=" + id); //opens the edit-contact.html page with the contact id as a query parameter.
                }

        </script>
    </body>
</html>
