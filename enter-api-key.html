<!DOCTYPE html>
<html>
    <head>
        <title>API Key</title>
        <meta charset="UTF-8"> <!-- Character encoding. Ensures that the webpage can display text correctly, including special characters, emojis, and non-English characters. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- ensures that the webpage is responsive and displays correctly on diff. devices and screens -->
    </head>
    <body>
        <div>Please enter a valid API key.</div>
        <form>
            <input type="email" id="apiKey" name="apiKey"/>
            <button id="submitApiKey">Submit</button>
        </form>


        <script>
            let rootPath = "https://mysite.itvarsity.org/api/ContactBook/";
            document.getElementById("submitApiKey").addEventListener("click", setApiKey);

            function setApiKey(e) {
                e.preventDefault(); // Prevents the default form submission behavior

                apiKey = document.getElementById("apiKey").value; 
                fetch(rootPath + "controller/set-api-key/" + apiKey)
                    .then(function(response) {
                        return response.text(); // Converts the response to text
                    })
                    .then(function(data) {

                        if (data == "1") {
                            localStorage.setItem("apiKey", apiKey); 
                            window.open("index.html", "_self"); // Redirects to index.html
                        } else {
                            alert(data + "Invalid API key enetered!");
                        }
                    })
            }
                
        </script>
    </body>
        
</html>
