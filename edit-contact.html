<html>
    <head>
        <meta charset="UTF -8">
        <title></title>
    </head>
    <body onload="getContact()"> <!-- onload handler that calls the getContact function when the page loads. -->
        <div id="avatarImage"></div>
        <form id="editForm">
            <label for="firstname">First Name </label>
            <input type="text" name="firstname" id="firstname" readonly><br/> <!---readonly attribute makes the input field uneditable.-->
            <label for="lastname">Last Name</label>
            <input type="text" name="lastname" id="lastname" readonly><br/>
            <label for="mobile">Mobile</label>
            <input type="text" name="mobile" id="mobile" readonly><br/>
            <label for="email">Email</label>
            <input type="text" name="email" id="email" readonly><br/>
            <label for="avatar" id="avatarLabel" hidden>change profile image</label><br/>
            <input type="file" name="avatar" id="avatar" hidden><br/>
            <br/>
            <button type="submit" id="submitForm" hidden>Submit</button>
            </form>
            <br/><br/>
            <button id="homeLink" type="button">Home</button>
            <button id="editContact" type="button">Edit</button>
            <button id="deleteContact" type="button">Delete</button>

            <script src="config.js"></script>
            <script>
                var id = getId(); 
                document.getElementById("homeLink").addEventListener("click", homeLink); //adds an event listener to the homeLink button that calls the homeLink function when clicked.
                document.getElementById("editContact").addEventListener("click", editContact); 
                document.getElementById("submitForm").addEventListener("click", submitForm);
                document.getElementById("deleteContact").addEventListener("click", deleteContact); //adds an event listener to the deleteContact button that calls the deleteContact function when clicked.
               

                function getId(){
                    var url = window.location.href; //gets the current URL of the page
                    var pos = url.search("="); //searches for the position of the "?" character in the URL
                    var id = url.slice(pos + 1); //slicing the url. cut out parts that arent necessary.
                    return id; //returns the id to caller
                }

                function getContact(){
                    fetch(rootPath + "controller/get-contacts/?id=" + id) 
                    .then(function(response) {
                        return response.json(); //converts the response to JSON
                    })
                    .then(function(data) {
                        displayOutput(data); //calls the displayOutput function and passes the data to it
                        
                })
                }

                function homeLink() { // Function to handle the home link click
                    window.open("index.html", "_self"); // Open the homepage in the same tab/window. "self"
                } 

                function displayOutput(data) {
                    avatarImg = `
                        <img src="${rootPath}/controller/uploads/${data[0].avatar}" width="200" />
                        `;  

                    document.getElementById("avatarImage").innerHTML = avatarImg; 
                    document.getElementById("firstname").value = data[0].firstname; //sets the value of the firstname input field to the firstname of the contact
                    document.getElementById("lastname").value = data[0].lastname;
                    document.getElementById("mobile").value = data[0].mobile;
                    document.getElementById("email").value = data[0].email;

                }

                function editContact() {
                    document.getElementById("firstname").readOnly = false; //makes the firstname input field editable
                    document.getElementById("lastname").readOnly = false; 
                    document.getElementById("mobile").readOnly = false;
                    document.getElementById("email").readOnly = false;
                    document.getElementById("avatar").hidden = false; //shows the avatar input field
                    document.getElementById("submitForm").hidden = false; //shows the submit button
                }

                function submitForm(e) {
                    e.preventDefault(); // Prevents the default form submission behavior

                    const form = new FormData(document.querySelector('#editForm')); //creates a new FormData object from the editForm
                    form.append('apiKey', apiKey); 
                    form.append('id', id); 

                fetch(rootPath + 'controller/insert-contact/', {
                    method: 'POST',
                    headers: {'Accept': 'application/json, *.*'},
                    body: form
                })
                .then(function(response) {
                    return response.text();
                })
                .then(function(data) {
                    if (data == "1") {
                        alert("Contact added");
                        homeLink(); // Call the homeLink function to redirect to the homepage
                    } else {
                        alert(data);
                        homeLink(); 
                    }
                })
          }

          function deleteContact() {
            var confirmDelete = confirm("Are you sure you want to delete this contact?"); //shows a confirmation dialog

            if(confirmDelete) {
                fetch(rootPath + "controller/delete-contact/?id=" + id)
                    .then(function(response) {
                        return response.text(); //converts the response to text
                    })
                    .then(function(data) {
                        if(data == "1") {
                            homeLink(); //redirects to the homepage if the contact is deleted successfully
                        } else {
                            alert(data); //shows an alert with the error message if the contact is not deleted successfully
                        }
                    })
                }
                    
            }
                
            </script>
    </body>
</html>
